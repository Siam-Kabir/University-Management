name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (6)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test account business rules
        run: bash ./mvnw --batch-mode -Dtest=AccountServiceTests test
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: target/surefire-reports/
          if-no-files-found: ignore

  integration:
    name: Account integration tests (3, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/university_test
      TEST_DB_DRIVER: org.postgresql.Driver
      TEST_DB_USER: university
      TEST_DB_PASSWORD: ci_test_password
      EXPECT_POSTGRES: 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: university_test
          POSTGRES_USER: university
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U university -d university_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run all three account workflows against PostgreSQL
        run: bash ./mvnw --batch-mode -Dtest=AccountWorkflowIntegrationTests test
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-report
          path: target/surefire-reports/
          if-no-files-found: ignore

  existing-api:
    name: Existing API regression tests (8)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run existing security and CRUD tests
        run: bash ./mvnw --batch-mode -Dtest=UniversityApiTests test
      - name: Upload existing API test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: existing-api-test-report
          path: target/surefire-reports/
          if-no-files-found: ignore
