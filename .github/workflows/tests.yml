name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (6)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test account business rules
        run: bash ./mvnw --batch-mode -Dtest=AccountServiceTests test
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: target/surefire-reports/
          if-no-files-found: ignore

  integration:
    name: Integration ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: create
            label: 1/3 - create and view student
            method: adminCreatesStudentWhoCanSeeOnlyTheirOwnRecord
          - id: conflict
            label: 2/3 - reject duplicate email
            method: conflictingUpdateReturns409AndLeavesStoredAccountIntact
          - id: normalize
            label: 3/3 - normalize existing email
            method: existingMixedCaseEmailCanBeNormalizedOnUpdate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test one complete HTTP account workflow
        run: bash ./mvnw --batch-mode "-Dtest=AccountWorkflowIntegrationTests#${{ matrix.method }}" test
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.id }}-report
          path: target/surefire-reports/
          if-no-files-found: ignore

  existing-api:
    name: Existing API regression tests (8)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run existing security and CRUD tests
        run: bash ./mvnw --batch-mode -Dtest=UniversityApiTests test
      - name: Upload existing API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-api-test-report
          path: target/surefire-reports/
          if-no-files-found: ignore
