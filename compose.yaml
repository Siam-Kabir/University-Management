services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: university
      POSTGRES_PASSWORD: ${DB_PASSWORD:-university_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/university
      DB_USER: university
      DB_PASSWORD: ${DB_PASSWORD:-university_dev}
      DEMO_USERS_ENABLED: "true"
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-Teacher123!}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-Student123!}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
