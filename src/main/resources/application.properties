spring.application.name=management
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/university}
spring.datasource.username=${DB_USER:university}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
demo.users.enabled=${DEMO_USERS_ENABLED:false}
demo.admin.password=${DEMO_ADMIN_PASSWORD:}
demo.teacher.password=${DEMO_TEACHER_PASSWORD:}
demo.student.password=${DEMO_STUDENT_PASSWORD:}
